<!DOCTYPE html>
<html>
  <body>
    <input type="text" id="audioInput">
    <button id="sendBtn">Send String</button>

    <script src="index.js"></script>
    <script>
      Module.onRuntimeInitialized = () => {
        console.log("The WASM is fully loaded and main() has run.");
      };
      document.getElementById('sendBtn').onclick = () => {
        const str = document.getElementById('audioInput').value;
        Module.ccall('process_input_string', null, ['string'], [str]);
      };
    </script>
  </body>
</html>
