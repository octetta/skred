name: Skred CI & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  check_build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: x86_64-windows
            os: ubuntu-latest
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-macos
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install ALSA (Linux Only)
        if: matrix.target == 'x86_64-linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Verify Compilation
        run: |
          if [[ "${{ matrix.os }}" == "macos"* ]] || [[ "${{ matrix.target }}" == "x86_64-linux" ]]; then
            # Native builds for Mac and Linux to ensure system headers are found
            zig build
          else
            # Cross-compile for Windows from Linux
            zig build -Dtarget=${{ matrix.target }}
          fi

  create_release:
    needs: check_build
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux
            os: ubuntu-latest
          - target: x86_64-windows
            os: ubuntu-latest
          - target: aarch64-macos
            os: macos-latest
          - target: x86_64-macos
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install ALSA (Linux Only)
        if: matrix.target == 'x86_64-linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build
        run: |
          if [[ "${{ matrix.os }}" == "macos"* ]] || [[ "${{ matrix.target }}" == "x86_64-linux" ]]; then
            zig build zip -Dversion=${{ github.ref_name }}
          else
            zig build zip -Dtarget=${{ matrix.target }} -Dversion=${{ github.ref_name }}
          fi

      - name: Rename ZIP for Architecture Clarity
        run: |
          cd zig-out
          # Identify the generic zip and give it a unique name from the matrix
          GENERIC_ZIP=$(ls *.zip | head -n 1)
          UNIQUE_NAME="skred-${{ matrix.target }}-${{ github.ref_name }}.zip"
          mv "$GENERIC_ZIP" "$UNIQUE_NAME"
          echo "Final asset name: $UNIQUE_NAME"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: zig-out/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
